<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гаджи | Человек за кодом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --orange: #ff6b00;
    --orange-dim: #c24d00;
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1c1c1c;
    --border: #242424;
    --text: #f0f0f0;
    --muted: #666;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Archivo', sans-serif;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 20px 64px;
  }

  .page {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Avatar */
  .avatar-wrap {
    position: relative;
    margin-bottom: 20px;
    animation: fadeDown 0.6s ease both;
  }

  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b00, #ff9a3c);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Archivo Black', sans-serif;
    font-size: 30px;
    color: #fff;
    letter-spacing: -1px;
    position: relative;
    z-index: 1;
  }

  .avatar-ring {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(#ff6b00, #ff9a3c, #ff6b00, #c24d00, #ff6b00);
    z-index: 0;
    animation: spin 8s linear infinite;
    opacity: 0.6;
  }

  .avatar-ring-mask {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: transparent;
    z-index: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Name & tagline */
  .name {
    font-family: 'Archivo Black', sans-serif;
    font-size: 22px;
    color: #fff;
    text-align: center;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
    animation: fadeDown 0.6s 0.1s ease both;
  }

  .name span { color: var(--orange); }

  .tagline {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 40px;
    animation: fadeDown 0.6s 0.15s ease both;
  }

  /* Links */
  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 16px;
    text-decoration: none;
    background: var(--surface);
    border: 0.5px solid var(--border);
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.2s;
    border-radius: inherit;
  }

  .btn:hover {
    transform: translateY(-2px);
    background: var(--surface2);
    border-color: #333;
  }

  .btn:hover::before { opacity: 1; }
  .btn:active { transform: translateY(0) scale(0.98); }

  .btn-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .btn-body { flex: 1; }

  .btn-sub {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .btn-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }

  .btn-arrow {
    font-size: 18px;
    color: #333;
    transition: color 0.15s, transform 0.15s;
  }

  .btn:hover .btn-arrow {
    color: var(--orange);
    transform: translateX(3px);
  }

  /* Icon backgrounds */
  .ic-ig { background: #1a0f1f; }
  .ic-tg { background: #0a1929; }
  .ic-yt { background: #1f0a0a; }
  .ic-wa { background: #0a1f10; }
  .ic-em { background: #1a140a; }

  /* Animation delays */
  .btn:nth-child(1) { animation: fadeUp 0.5s 0.25s ease both; }
  .btn:nth-child(2) { animation: fadeUp 0.5s 0.32s ease both; }
  .btn:nth-child(3) { animation: fadeUp 0.5s 0.39s ease both; }
  .btn:nth-child(4) { animation: fadeUp 0.5s 0.46s ease both; }
  .btn:nth-child(5) { animation: fadeUp 0.5s 0.53s ease both; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Footer */
  .footer {
    margin-top: 40px;
    font-size: 11px;
    color: #2a2a2a;
    text-align: center;
    animation: fadeUp 0.5s 0.7s ease both;
  }

  .footer span { color: var(--orange-dim); }

  /* Noise overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.025;
    pointer-events: none;
    z-index: 9999;
  }

  @media (max-width: 480px) {
    body { padding: 36px 16px 48px; }
    .name { font-size: 19px; }
  }
</style>
</head>
